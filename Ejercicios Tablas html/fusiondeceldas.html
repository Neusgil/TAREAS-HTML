<!DOCTYPE html>
<html>
  <head lang="es">
    <meta charset="utf-8" />
    <title>Fusion de celdas</title>
  </head>
  <body>
    <h1>Analisis de Ventas</h1>
    <table border="1">
      <caption>
        Analisis de ventas anuales
      </caption>
      <thead>
        <tr>
          <th rowspan="2">Año</th>
          <th colspan="4">Expansión de ventas</th>
        </tr>
        <tr>
          <th>Producto A</th>
          <th>Producto B</th>
          <th>Producto C</th>
          <th>Producto D</th>
        </tr>
      </thead>
      <tfoot>
        <tr>
          <th rowspan="2">Año</th>
          <th>Producto A</th>
          <th>Producto B</th>
          <th>Producto C</th>
          <th>Producto D</th>
        </tr>
        <tr>
          <th colspan="4">Expansión de ventas</th>
        </tr>
      </tfoot>
      <tbody>
        <tr>
          <td>N-3</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
        </tr>
        <tr>
          <td>N-2</td>
          <td>3</td>
          <td>5</td>
          <td>8</td>
          <td>4</td>
        </tr>
        <tr>
          <td>N-1</td>
          <td>4</td>
          <td>4</td>
          <td>7</td>
          <td>3</td>
        </tr>
        <tr>
          <td>N</td>
          <td>5</td>
          <td>7</td>
          <td>6</td>
          <td>2</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
