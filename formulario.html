<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Formulario</title> 
  </head>
  <body>
    <h1>Formulario Estructurado</h1>
    <form action="http://127.0.0.1:5501/Html/TAREAS-HTML/formulario.html", method="post", 
    name="Formulario Estructurado", target="_blank", autocomplete="on">
    <fieldset>
      <legend>Datos Personales</legend>
      <div>
        <label for ="nombre">Nombre:</label>
      </div>
        <input type="text" id="nombre" name="nombre">
      <br><br>
      <div>
        <label for="apellidos">Apellidos:</label>
      </div>
        <input type="text" id="apellidos" name="apellidos">
      <br><br>
      <div>
        <label for="dni">DNI</label>
      </div>
        <input type="text" id="dni" name="dni", maxlength="9", pattern="[0-9]{8}[A-Za-z]{1}",required>
      <br><br>
    </fieldset>
    <fieldset>
      <legend>Datos de conexión</legend>
      <div>
        <label for="usuario">Usuario:</label>
      </div>
        <input type="text" id="usuario" name="usuario">
      <br><br>
      <div>
        <label for="contraseña">Contraseña:</label>
      </div>
        <input type="password" id="password" name="password", minlength="8", 
        pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&._-])[A-Za-z\d@$!%*?&._-]{8,}$", 
        title="Debe tener mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial"
        required>
      <br><br>
      <div>
        <lab for="confirmar_contraseña">Confirmar Contraseña:</label>
      </div>
        <input type="password" id="confirmar_contraseña" name="confirmar_contraseña" placeholder="Repite tu contraseña" minlength="8",
        required>
      <br><br>  
    </fieldset>
    <button type="submit">Enviar</button>
  </form>
</html>
