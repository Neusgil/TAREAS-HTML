<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario de registro - Mi web</title>
  </head>
  <body>
    <h1>Formulario de registro</h1>

    <form action="" method="GET">
      <p>
        <label for="nombre">Nombre:</label><br />
        <input type="text" id="nombre" name="nombre" maxlength="50" />
      </p>

      <p>
        <label for="apellidos">Apellidos:</label><br />
        <input type="text" id="apellidos" name="apellidos" maxlength="50" />
      </p>

      <p>
        Sexo:<br />

        <input type="radio" id="hombre" name="sexo" value="hombre" />
        <label for="hombre">Hombre</label>

        <input type="radio" id="mujer" name="sexo" value="mujer" />
        <label for="mujer">Mujer</label>
      </p>

      <p>
        <label for="correo">Correo electrónico:</label><br />
        <input type="email" id="correo" name="correo" />
      </p>

      <p>
        <label for="poblacion">Población:</label><br />
        <select id="poblacion" name="poblacion">
          <option value="alicante">Alicante</option>
          <option value="madrid">Madrid</option>
          <option value="sevilla">Sevilla</option>
          <option value="valencia">Valencia</option>
        </select>
      </p>

      <p>
        <label for="descripcion">Descripción:</label><br />
        <textarea
          id="descripcion"
          name="descripcion"
          rows="5"
          cols="40"
        ></textarea>
      </p>

      <p>
        <input type="checkbox" id="info" name="info" checked />
        <label for="info"
          >Deseo recibir información sobre novedades y ofertas</label
        >
      </p>

      <p>
        <input type="checkbox" id="condiciones" name="condiciones" />
        <label for="condiciones">
          Declaro haber leído y aceptar las condiciones generales del programa y
          la normativa sobre protección de datos
        </label>
      </p>

      <p>
        <button type="submit">Enviar</button>
      </p>
    </form>
  </body>
</html>
